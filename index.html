<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الحضور - المعهد العالي للهندسة</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #1e3c72, #2a5298, #0f2027); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-card { 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
        }
        .form-control-lg {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff !important;
            border-radius: 15px;
            font-size: 24px;
            letter-spacing: 5px;
            font-weight: bold;
        }
        .form-control-lg:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }
        .form-control-lg::placeholder {
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: normal;
            font-size: 18px;
        }
        .btn-modern {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            color: #fff;
            border-radius: 15px;
            padding: 15px;
            font-size: 20px;
            transition: all 0.3s ease;
        }
        .btn-modern:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5);
            color: #fff;
        }
        .engineering-icon {
            font-size: 50px;
            margin-bottom: 15px;
            color: #00c6ff;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="main-card text-center">
        <div class="engineering-icon">📐</div>
        <h2 class="fw-bold mb-2">المعهد العالي للهندسة</h2>
        <p class="text-white-50 mb-4">نظام تسجيل حضور الطلاب الذكي</p>
        
        <form id="studentForm">
            <div class="mb-4 text-start">
                <label class="form-label fw-bold small text-white-50 ps-2">أدخل كودك الأكاديمي (6 أرقام)</label>
                <input type="text" id="studentIdInput" maxlength="6" pattern="\d{6}" class="form-control form-control-lg text-center" required placeholder="000000">
            </div>
            <button type="submit" class="btn btn-modern w-100 fw-bold">تأكيد تسجيل الحضور الآن</button>
        </form>
    </div>
</div>

<script>
    // دالة النغمة الصوتية المميزة عند تأكيد الحضور
    function playNotificationSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.15);
            
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.25);
            }, 100);
        } catch(e) { console.log(e); }
    }

    // دالة الحذف والمسح التلقائي بعد 12 ساعة
    function checkExpiration() {
        const startTime = localStorage.getItem('lectureStartTime');
        if (startTime) {
            const currentTime = new Date().getTime();
            const twelveHoursInMs = 12 * 60 * 60 * 1000;
            if ((currentTime - startTime) > twelveHoursInMs) {
                localStorage.removeItem('attendanceRecords');
                localStorage.removeItem('lectureStartTime');
            }
        }
    }

    // معالجة الضغط وإرسال البيانات
    document.getElementById('studentForm').addEventListener('submit', (e) => {
        e.preventDefault();
        checkExpiration();

        const inputVal = document.getElementById('studentIdInput').value;
        const studentId = parseInt(inputVal);

        if (inputVal.length !== 6 || isNaN(studentId)) {
            alert("خطأ: يجب أن يتكون الكود الأكاديمي من 6 أرقام تماماً!");
            return;
        }

        // جلب السجلات الحالية أو إنشاء قائمة جديدة
        let attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
        
        // إذا كانت القائمة فارغة تماماً (أول طالب يسجل)، نضبط مؤقت الـ 12 ساعة من الآن
        if (attendanceRecords.length === 0) {
            localStorage.setItem('lectureStartTime', new Date().getTime());
        }

        // منع الطالب من تسجيل نفسه مرتين
        const alreadyRegistered = attendanceRecords.some(rec => rec.id === studentId);
        if (alreadyRegistered) {
            alert("تنبيه: لقد تم تسجيل حضور هذا الكود مسبقاً في هذه الجلسة!");
            return;
        }

        // إضافة الطالب الجديد
        const now = new Date();
        const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        attendanceRecords.push({ id: studentId, time: timeString });
        
        // حفظ البيانات في ذاكرة الهاتف/الموقع بشكل دائم ومستمر
        localStorage.setItem('attendanceRecords', JSON.stringify(attendanceRecords));

        // تشغيل صوت الإرسال بنجاح
        playNotificationSound();

        alert(`تم رصد وتأكيد حضورك بنجاح ✅`);
        document.getElementById('studentForm').reset();
    });

    window.onload = checkExpiration;
</script>

<script src="https://jsdelivr.net"></script>
</body>
</html>
