<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور الذكي - المعهد العالي للهندسة</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            color: #fff;
        }
        .main-card { 
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: #fff;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff !important;
            border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .nav-pills .nav-link {
            color: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .nav-pills .nav-link.active { 
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-modern-primary {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            color: #fff;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-modern-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
            color: #fff;
        }
        .btn-modern-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            border: none;
            color: #fff;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-modern-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
            color: #fff;
        }
        .student-row { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px 20px; 
            border-radius: 12px; 
            margin-bottom: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .alert-custom-info {
            background: rgba(0, 198, 255, 0.15);
            border: 1px solid #00c6ff;
            color: #00d2ff;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold" style="background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">المعهد العالي للهندسة</h1>
        <p class="text-light-50 fs-5">بوابة الحضور الرقمية الذكية للمحاضرات</p>
    </div>

    <!-- مفاتيح التبديل العصرية -->
    <ul class="nav nav-pills nav-justified p-2 bg-dark bg-opacity-20 rounded-3 mb-5" id="pills-tab" role="tablist" style="border: 1px solid rgba(255,255,255,0.05);">
        <li class="nav-item">
            <button class="nav-link active fw-bold fs-5" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-view">بوابة الطالب</button>
        </li>
        <li class="nav-item">
            <button class="nav-link fw-bold fs-5" id="professor-tab" data-bs-toggle="pill" data-bs-target="#professor-view">لوحة الأستاذ</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        <!-- واجهة الطالب -->
        <div class="tab-pane fade show active" id="student-view">
            <div class="main-card p-4 col-lg-6 mx-auto">
                <h3 class="mb-4 text-center fw-bold">تسجيل حضور الجلسة</h3>
                <div id="lectureAlert" class="alert alert-custom-info text-center d-none">
                    المادة النشطة حالياً: <strong id="studentViewSubject">--</strong>
                </div>
                <form id="studentForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-white-50">كود الطالب الأكاديمي (6 أرقام)</label>
                        <input type="text" id="studentIdInput" maxlength="6" pattern="\d{6}" class="form-control form-control-lg text-center" required placeholder="أدخل أي 6 أرقام">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-white-50">كود أمان المحاضرة الحالي</label>
                        <input type="text" id="lectureCodeInput" class="form-control form-control-lg text-center" required placeholder="اطلب الكود من الدكتور">
                    </div>
                    <button type="submit" class="btn btn-modern-primary w-100 py-3 fw-bold fs-5">تأكيد حضورك الآن</button>
                </form>
            </div>
        </div>

        <!-- واجهة الأستاذ والكشف -->
        <div class="tab-pane fade" id="professor-view">
            <div class="main-card p-4 mb-4">
                <h3 class="mb-4 text-center fw-bold" style="color: #38ef7d;">تجهيز محاضرة جديدة</h3>
                <form id="profForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-white-50">اسم المادة الهندسية</label>
                            <input type="text" id="subjectName" class="form-control form-control-lg" required placeholder="مثال: ديناميكا منشآت">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-white-50">كود الأمان المقترح للمحاضرة</label>
                            <input type="text" id="profLectureCode" class="form-control form-control-lg" required placeholder="مثال: X99">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-modern-success w-100 py-3 fw-bold fs-5 mt-2">تفعيل الجلسة (صلاحية 12 ساعة)</button>
                </form>
            </div>

            <!-- قائمة الحضور المستلمة في المتصفح -->
            <div class="main-card p-4">
                <h4 class="mb-4 fw-bold text-center" style="color: #00c6ff;">كشف حضور الطلاب التلقائي</h4>
                <div id="attendanceList" class="p-1" style="max-height: 350px; overflow-y: auto;">
                    <p class="text-white-50 text-center py-4" id="noStudentsMsg">لا توجد تسجيلات حضور نشطة لهذه المحاضرة حتى الآن.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // دالة لتوليد صوت الإشعار برمجياً (مثل نغمة رسائل التطبيقات)
    function playNotificationSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // النوتة الأولى (منخفضة)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime); // نغمة D5
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.15);
            
            // النوتة الثانية (مرتفعة وسريعة تليها مباشرة لتصنع صوت "تنّ!")
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime); // نغمة A5
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.25);
            }, 100);
        } catch(e) {
            console.log("Audio not supported or blocked by browser settings", e);
        }
    }

    // دالة التحقق التلقائي ومسح البيانات بعد 12 ساعة
    function checkExpiration() {
        const startTime = localStorage.getItem('lectureStartTime');
        if (startTime) {
            const currentTime = new Date().getTime();
            const twelveHoursInMs = 12 * 60 * 60 * 1000;
            
            if ((currentTime - startTime) > twelveHoursInMs) {
                localStorage.removeItem('activeSubject');
                localStorage.removeItem('activeCode');
                localStorage.removeItem('lectureStartTime');
                localStorage.removeItem('attendanceRecords');
                alert("تنبيه نظام الأمان: انتهت صلاحية الجلسة المحددة بـ 12 ساعة، وتم تصفير الكشوفات تلقائياً.");
            }
        }
    }

    // تحديث عناصر الشاشات بانتظام
    function updateUI() {
        checkExpiration();
        const subject = localStorage.getItem('activeSubject');
        const attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];

        if (subject) {
            document.getElementById('lectureAlert').classList.remove('d-none');
            document.getElementById('studentViewSubject').innerText = subject;
        } else {
            document.getElementById('lectureAlert').classList.add('d-none');
        }
