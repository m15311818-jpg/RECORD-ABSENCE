<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور الذكي - المعهد العالي للهندسة</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            color: #fff;
            padding: 30px 0;
        }
        .main-card { 
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }
        .form-control-lg {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff !important;
            border-radius: 15px;
            font-weight: bold;
        }
        .form-control-lg:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
        .btn-modern-primary {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none; color: #fff; border-radius: 15px; padding: 15px;
            font-weight: bold;
        }
        .btn-modern-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            border: none; color: #fff; border-radius: 15px; padding: 15px;
            font-weight: bold;
        }
        .student-row { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px 20px; border-radius: 12px; margin-bottom: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .alert-custom {
            background: rgba(0, 198, 255, 0.15); border: 1px solid #00c6ff; color: #00d2ff; border-radius: 15px;
        }
        .btn-settings {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255,255,255,0.4); border-radius: 10px; padding: 5px 15px; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-4">
        <h1 class="fw-bold" style="background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">المعهد العالي للهندسة</h1>
        <p class="text-white-50">نظام الحضور الرقمي للمحاضرات</p>
    </div>

    <!-- 1️⃣ لوحة إعداد الدكتور -->
    <div id="profSetupArea" class="main-card p-4 col-lg-6 mx-auto mb-4" style="display: block;">
        <h3 class="mb-4 text-center fw-bold" style="color: #38ef7d;">تهيئة محاضرة جديدة</h3>
        <div class="mb-3">
            <label class="form-label fw-bold small text-white-50">اسم المادة / المحاضرة</label>
            <input type="text" id="subjectName" class="form-control form-control-lg" placeholder="مثال: هندسة إنشائية">
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold small text-white-50">رمز الأمان السري للمحاضرة</label>
            <input type="password" id="profSecretCode" class="form-control form-control-lg text-center" placeholder="أدخل الرقم السري للقفل">
        </div>
        <button type="button" onclick="startLectureNow()" class="btn btn-modern-success w-100 fs-5">تسجيل محاضرة جديدة وبدء الرصد</button>
    </div>

    <!-- 2️⃣ شاشة تسجيل الطالب -->
    <div id="studentFormArea" class="main-card p-4 col-lg-6 mx-auto mb-4" style="display: none;">
        <h3 class="mb-3 text-center fw-bold">تسجيل حضور الجلسة</h3>
        <div class="alert alert-custom text-center mb-4">
            المادة النشطة الآن: <strong id="currentActiveSubject">--</strong>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label fw-bold small text-white-50 ps-2">أدخل كودك الأكاديمي (6 أرقام)</label>
            <input type="text" id="studentIdInput" maxlength="6" class="form-control form-control-lg text-center fs-3" placeholder="000000">
        </div>
        <button type="button" onclick="submitStudentAttendance()" class="btn btn-modern-primary w-100 fs-5">تأكيد حضورك الآن</button>
    </div>

    <!-- 3️⃣ كشف حضور الطلاب بالأسفل مباشرة -->
    <div id="attendanceReportArea" class="main-card p-4 col-lg-6 mx-auto" style="display: none;">
        <h4 class="mb-4 fw-bold text-center" style="color: #00c6ff;">📋 الطلاب الحاضرين حالياً</h4>
        <div id="attendanceList" style="max-height: 300px; overflow-y: auto;">
            <!-- القائمة تظهر هنا -->
        </div>
    </div>

    <!-- زر إنهاء المحاضرة للعودة للبداية -->
    <div class="text-center mt-5">
        <button class="btn btn-settings" onclick="resetSystemManual()">⚙️ إنهاء المحاضرة الحالية</button>
    </div>
</div>

<script>
    // دالة الصوت المميز عند التسجيل
    function playNotificationSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc1.start(); osc1.stop(audioCtx.currentTime + 0.15);
            
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc2.start(); osc2.stop(audioCtx.currentTime + 0.25);
            }, 100);
        } catch(e) { console.log(e); }
    }

    // فحص الـ 12 ساعة ومسح البيانات تلقائياً
    function checkExpiration() {
        const startTime = localStorage.getItem('lectureStartTime');
        if (startTime) {
            const currentTime = new Date().getTime();
            const twelveHoursInMs = 12 * 60 * 60 * 1000;
            if ((currentTime - startTime) > twelveHoursInMs) {
                clearAllData();
            }
        }
    }

    function clearAllData() {
        localStorage.removeItem('activeSubject');
        localStorage.removeItem('systemSecretCode');
        localStorage.removeItem('lectureStartTime');
        localStorage.removeItem('attendanceRecords');
    }

    // تحديث الشاشات والبيانات بالتبديل المباشر الصريح
    function updateUI() {
        checkExpiration();
        const subject = localStorage.getItem('activeSubject');
        const records = JSON.parse(localStorage.getItem('attendanceRecords')) || [];

        const setupArea = document.getElementById('profSetupArea');
        const studentArea = document.getElementById('studentFormArea');
        const reportArea = document.getElementById('attendanceReportArea');
        const listDiv = document.getElementById('attendanceList');

        if (subject) {
            setupArea.style.display = 'none';
            studentArea.style.display = 'block';
            reportArea.style.display = 'block';
            document.getElementById('currentActiveSubject').innerText = subject;

            listDiv.innerHTML = "";
            if (records.length === 0) {
                listDiv.innerHTML = "<p class='text-white-50 text-center py-3'>لا توجد تسجيلات حضور حتى الآن.</p>";
            } else {
                records.forEach((rec, idx) => {
                    listDiv.innerHTML += `
                        <div class="student-row d-flex justify-content-between align-items-center">
                            <span class="fw-bold" style="color: #00d2ff;">👤 م: ${idx+1} &nbsp;|&nbsp; كود الطالب: ${rec.id}</span>
                            <span class="badge bg-light bg-opacity-10 text-white-50 p-2">⏰ ${rec.time}</span>
                        </div>`;
                });
            }
        } else {
            setupArea.style.display = 'block';
            studentArea.style.display = 'none';
            reportArea.style.display = 'none';
        }
    }

    // الضغط الذكي لبدء المحاضرة (بدون فورم لتجنب الريفرش)
    function startLectureNow() {
        const subject = document.getElementById('subjectName').value.trim();
        const secret = document.getElementById('profSecretCode').value.trim();

        if (!subject || !secret) {
            alert("خطأ: يرجى ملء اسم المادة ورمز الأمان أولاً!");
            return;
        }

        localStorage.setItem('activeSubject', subject);
        localStorage.setItem('systemSecretCode', secret);
        localStorage.setItem('lectureStartTime', new Date().getTime());
        localStorage.setItem('attendanceRecords', JSON.stringify([]));

        updateUI();
        document.getElementById('subjectName').value = "";
        document.getElementById('profSecretCode').value = "";
    }

    // تسجيل الطلاب وحفظهم فوراً وعرضهم بالأسفل
    function submitStudentAttendance() {
        checkExpiration();
        const inputVal = document.getElementById('studentIdInput').value.trim();
        const studentId = parseInt(inputVal);

        if (inputVal.length !== 6 || isNaN(studentId)) {
            alert("خطأ: يجب أن يتكون الكود الأكاديمي من 6 أرقام تماماً!");
            return;
        }

        let attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
